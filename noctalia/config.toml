[bar.default]
capsule_radius = 0
center = ["clock", "weather"]
concave_edge_corners = false
end = [
    "group:g1",
    "space",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "notifications"
]
margin_ends = 0
padding = 10
radius = 0
start = ["session", "workspaces", "space", "taskbar"]
thickness = 30

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g1"
members = ["privacy", "tray", "caffeine", "power_profile"]
opacity = 1.0
padding = 6.0

[brightness]
enable_ddcutil = true

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 240.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 300.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 180.0

[location]
auto_locate = true

[shell]
clipboard_enabled = false
corner_radius_scale = 0.0
font_family = "Geist"
polkit_agent = true
settings_show_advanced = true

[theme]
builtin = "Rosé Pine"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "hyprland", "kitty", "niri", "qt"]
community_ids = ["neovim"]

[widget.clock]
format = "{:%A %H:%M}"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.space]
type = "spacer"

[widget.taskbar]
inactive_opacity = 0.5
only_active_workspace = true

[widget.weather]
show_condition = false
